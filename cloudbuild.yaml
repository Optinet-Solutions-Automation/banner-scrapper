# Google Cloud Build config for Cloud Run deployment
# Usage: gcloud builds submit --config cloudbuild.yaml
# Or: connect this repo in Cloud Build triggers for CI/CD

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - 'gcr.io/$PROJECT_ID/banner-scraper:latest'
      - '.'

  # Push to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/banner-scraper'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - banner-scraper
      - '--image=gcr.io/$PROJECT_ID/banner-scraper:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--concurrency=20'
      - '--timeout=3600'
      - '--min-instances=0'
      - '--max-instances=1'

  # Apply all environment variables from .tmp/cloudrun-env.yaml
  # Uses | as delimiter (safe — none of our values contain |)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        cat > /tmp/setenv.py << 'PYEOF'
        import subprocess

        vars = {}
        for line in open('/workspace/.tmp/cloudrun-env.yaml'):
            line = line.strip()
            if ':' in line and not line.startswith('#'):
                k, _, v = line.partition(':')
                k = k.strip()
                v = v.strip().strip('"').strip("'")
                if k:
                    vars[k] = v

        # Use | as delimiter so commas in values (e.g. RES_PROXY_GEO_COUNTRIES) are safe
        pairs = '|'.join(k + '=' + v for k, v in vars.items())
        cmd = [
            'gcloud', 'run', 'services', 'update', 'banner-scraper',
            '--region=us-central1',
            '--set-env-vars=^|^' + pairs
        ]
        print('Setting', len(vars), 'environment variables on Cloud Run...')
        subprocess.run(cmd, check=True)
        print('Done.')
        PYEOF
        python3 /tmp/setenv.py

images:
  - 'gcr.io/$PROJECT_ID/banner-scraper'
